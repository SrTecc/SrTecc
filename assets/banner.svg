<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="SrTecc — automação, integrações e dados">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grade" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7dd3fc" opacity="0.13"/>
    </pattern>
    <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#fundo)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grade)"/>

  <!-- halos de cor, dão profundidade sem poluir -->
  <circle cx="1010" cy="60" r="110" fill="#38bdf8" opacity="0.20" filter="url(#suave)"/>
  <circle cx="1120" cy="215" r="95" fill="#818cf8" opacity="0.18" filter="url(#suave)"/>
  <circle cx="120" cy="240" r="90" fill="#22d3ee" opacity="0.10" filter="url(#suave)"/>

  <!-- barra de acento -->
  <rect x="72" y="96" width="5" height="92" rx="2.5" fill="url(#brilho)"/>

  <text x="102" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#f1f5f9" letter-spacing="-1">SrTecc</text>

  <text x="104" y="177" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" fill="#8fb3d9" letter-spacing="3.4">
    AUTOMAÇÃO · INTEGRAÇÕES · DADOS
  </text>

  <!-- linha de código decorativa -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="15" opacity="0.62">
    <text x="104" y="218" fill="#5f7fa6">
      <tspan fill="#7c8fa8">$</tspan>
      <tspan fill="#7dd3fc"> pipeline</tspan>
      <tspan fill="#94a3b8"> --coletar --filtrar --publicar</tspan>
      <tspan fill="#4ade80"> ✓</tspan>
    </text>
  </g>

  <!-- nós conectados: a ideia de integração -->
  <g stroke="url(#brilho)" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M905 148 L975 112 M975 112 L1048 148 M1048 148 L975 186 M975 186 L905 148"/>
  </g>
  <g fill="#0b1220" stroke="url(#brilho)" stroke-width="2.4">
    <circle cx="905" cy="148" r="9"/>
    <circle cx="975" cy="112" r="9"/>
    <circle cx="1048" cy="148" r="9"/>
    <circle cx="975" cy="186" r="9"/>
  </g>
  <circle cx="975" cy="149" r="4.5" fill="#22d3ee"/>
</svg>
