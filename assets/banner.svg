<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SrTecc, programo por hobby e construo por curiosidade">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020">
        <animate attributeName="stop-color"
          values="#0a1020;#0d1526;#0a141f;#0a1020" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#111a2e">
        <animate attributeName="stop-color"
          values="#111a2e;#0f1c33;#12202e;#111a2e" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0c1a29">
        <animate attributeName="stop-color"
          values="#0c1a29;#0a1826;#0d1d2c;#0c1a29" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <pattern id="grade" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7dd3fc" opacity="0.11"/>
    </pattern>

    <filter id="suave" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- losango que serve de contorno do simbolo e de trilho da particula -->
    <path id="trilho" d="M 985 150 L 1055 108 L 1125 150 L 1055 192 Z"/>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#fundo)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grade)"/>

  <!-- halos de cor, respirando devagar -->
  <circle cx="1060" cy="70" r="120" fill="#38bdf8" opacity="0.18" filter="url(#suave)">
    <animate attributeName="opacity" values="0.18;0.30;0.18" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="230" r="100" fill="#818cf8" opacity="0.16" filter="url(#suave)">
    <animate attributeName="opacity" values="0.16;0.26;0.16" dur="9s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="250" r="95" fill="#22d3ee" opacity="0.09" filter="url(#suave)">
    <animate attributeName="opacity" values="0.09;0.17;0.09" dur="11s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- pontos que piscam em tempos diferentes -->
  <g fill="#7dd3fc">
    <circle cx="300" cy="62" r="1.8" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="44" r="1.6" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="246" r="1.6" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="252" r="1.4" opacity="0.3">
      <animate attributeName="opacity" values="0.08;0.5;0.08" dur="7.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- barra de acento -->
  <rect x="76" y="104" width="5" height="96" rx="2.5" fill="url(#brilho)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="108" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f2f6fb" letter-spacing="-1.4">SrTecc</text>

  <text x="110" y="188" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#8fb3d9">
    programo por hobby, construo por curiosidade
  </text>

  <!-- simbolo: nos conectados que formam um olho -->
  <g>
    <use href="#trilho" fill="none" stroke="url(#brilho)" stroke-width="1.7" opacity="0.55"/>

    <!-- iris -->
    <circle cx="1055" cy="150" r="21" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.35">
      <animate attributeName="r" values="19;24;19" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- pupila -->
    <circle cx="1055" cy="150" r="6.5" fill="#22d3ee" filter="url(#halo)">
      <animate attributeName="r" values="6.5;8;6.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1055" cy="150" r="4" fill="#e0f7ff"/>

    <!-- nos -->
    <g fill="#0a1020" stroke="url(#brilho)" stroke-width="2.4">
      <circle cx="985" cy="150" r="8.5"/>
      <circle cx="1055" cy="108" r="8.5"/>
      <circle cx="1125" cy="150" r="8.5"/>
      <circle cx="1055" cy="192" r="8.5"/>
    </g>

    <!-- particula percorrendo as conexoes -->
    <circle r="3.6" fill="#a5f3fc" filter="url(#halo)">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#trilho"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
