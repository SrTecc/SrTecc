<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-label="qr-forge, gerador de QR Code para PIX, WhatsApp, WiFi e contato">
  <defs>
    <linearGradient id="bordaQr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="acentoQr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="439" height="175" rx="12" fill="#0b1220" stroke="url(#bordaQr)"/>
  <rect x="20" y="22" width="3" height="24" rx="1.5" fill="url(#acentoQr)"/>

  <text x="34" y="41" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#e6edf5">qr-forge</text>

  <text font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8fb3d9">
    <tspan x="34" y="72">Gera QR Code de PIX, WhatsApp, WiFi e contato.</tspan>
    <tspan x="34" y="93">Biblioteca, site e linha de comando, todos</tspan>
    <tspan x="34" y="114">montando o payload pelo mesmo lugar.</tspan>
  </text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f95ad">
    <circle cx="39" cy="145" r="5" fill="#3178c6"/>
    <text x="50" y="149">TypeScript</text>

    <circle cx="146" cy="145" r="5" fill="#4ade80"/>
    <text x="157" y="149">61 testes</text>

    <circle cx="243" cy="145" r="5" fill="#facc15"/>
    <text x="254" y="149">roda no terminal</text>
  </g>

  <g fill="#38bdf8" opacity="0.85" transform="translate(374, 108)">
    <rect x="0" y="0" width="14" height="14" rx="1.5"/>
    <rect x="18" y="0" width="6" height="6" rx="1"/>
    <rect x="28" y="0" width="14" height="14" rx="1.5"/>
    <rect x="18" y="9" width="6" height="6" rx="1"/>
    <rect x="0" y="18" width="6" height="6" rx="1"/>
    <rect x="10" y="18" width="6" height="6" rx="1"/>
    <rect x="28" y="18" width="6" height="6" rx="1"/>
    <rect x="0" y="28" width="14" height="14" rx="1.5"/>
    <rect x="18" y="28" width="6" height="6" rx="1"/>
    <rect x="28" y="37" width="14" height="5" rx="1"/>
    <rect x="37" y="28" width="5" height="5" rx="1"/>
  </g>
</svg>
